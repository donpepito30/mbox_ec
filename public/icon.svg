<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Shield Outline with Glow -->
  <path d="M256 64 C330 64, 400 96, 416 128 C416 264, 348 380, 256 448 C164 380, 96 264, 96 128 C112 96, 182 64, 256 64 Z" 
        fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="14" filter="url(#glow)"/>

  <!-- Inner Cyber Grid Accent -->
  <path d="M256 96 C314 96, 370 120, 384 148 C384 256, 332 350, 256 406 C180 350, 128 256, 128 148 C142 120, 198 96, 256 96 Z" 
        fill="#090d16" stroke="#1e293b" stroke-width="3"/>

  <!-- Play Triangle -->
  <polygon points="224,188 336,256 224,324" fill="url(#playGrad)"/>

  <!-- Small Shield Lock Icon Indicator -->
  <circle cx="256" cy="380" r="14" fill="#06b6d4"/>
</svg>
