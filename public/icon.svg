<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Paleta Oficial Mbox_Ec -->
    <radialGradient id="neonHalo" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FF1A24" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FF1A24" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <linearGradient id="prismLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF242E"/>
      <stop offset="100%" stop-color="#A00007"/>
    </linearGradient>

    <linearGradient id="prismCenterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1A24"/>
      <stop offset="60%" stop-color="#E60012"/>
      <stop offset="100%" stop-color="#8A0006"/>
    </linearGradient>

    <linearGradient id="prismRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B45"/>
      <stop offset="100%" stop-color="#A00007"/>
    </linearGradient>

    <linearGradient id="whiteLineFloor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo Squircle Carbón Oscuro #141419 con Borde Sutil #252530 -->
  <rect width="512" height="512" rx="128" fill="#141419"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#252530" stroke-width="8"/>

  <!-- Halo Neón Rojo #FF1A24 -->
  <circle cx="256" cy="220" r="180" fill="url(#neonHalo)"/>

  <!-- Emblema Central: Cinema Box Tridimensional (Sin botón de play) -->
  <g filter="url(#boxGlow)">
    <!-- Faceta Izquierda -->
    <path d="M140 140 L230 175 L230 340 L140 305 Z" fill="url(#prismLeftGrad)" stroke="#FF4D55" stroke-width="2"/>
    <!-- Faceta Central -->
    <path d="M230 175 L282 175 L282 340 L230 340 Z" fill="url(#prismCenterGrad)"/>
    <!-- Faceta Derecha -->
    <path d="M282 175 L372 140 L372 305 L282 340 Z" fill="url(#prismRightGrad)" stroke="#FF4D55" stroke-width="2"/>
    
    <!-- Bisel Superior Reflectivo en Blanco Óptico -->
    <path d="M140 140 L256 122 L372 140" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Línea Reflectiva Blanca de Escenario Inferior -->
  <line x1="120" y1="375" x2="392" y2="375" stroke="url(#whiteLineFloor)" stroke-width="10" stroke-linecap="round"/>

  <!-- Rótulo Inferior Tipográfico MBOX_EC -->
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
    <tspan fill="#FFFFFF">MBOX</tspan><tspan fill="#FF1A24">_EC</tspan>
  </text>
</svg>
